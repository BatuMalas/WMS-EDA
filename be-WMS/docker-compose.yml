# =============================================================
# WMS Modular Monolith — Docker Compose
# =============================================================
# Variabel Kontrol Tesis:
#   - App service dibatasi 2 vCPU dan 2GB RAM
#   - Sesuai kondisi pengujian beban Bab III
# =============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-app
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:RpEzPp1B9yud2sE1FKSWJ0KL3B+8G8/pdRfZ6iWBrvs=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: wms_db_eda
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: K4Si9vNYmdFYtwfMrF7IR1yq9JxsrgcJXlresry5b2JdwJ4waHFZuDpwfdeUatOp
      JWT_ALGO: HS256
      SESSION_DRIVER: database
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    volumes:
      - .:/var/www
    # depends_on:
    #   mysql:
    #     condition: service_healthy
    depends_on:
      - redis
    networks:
      - wms-network
    # ─── Resource Limits (Variabel Kontrol Tesis) ─────────────
    # Syntax yang benar untuk docker compose (bukan Swarm):
    #   cpus dan mem_limit di level service langsung
    deploy:
      resources:
        limits:
          cpus: '2.0'      # 2 vCPU
          memory: 2G       # 2 GB RAM
    # Untuk docker compose v2 style (lebih kompatibel):
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-worker
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:RpEzPp1B9yud2sE1FKSWJ0KL3B+8G8/pdRfZ6iWBrvs=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: wms_db_eda
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      JWT_SECRET: K4Si9vNYmdFYtwfMrF7IR1yq9JxsrgcJXlresry5b2JdwJ4waHFZuDpwfdeUatOp
      JWT_ALGO: HS256
    volumes:
      - .:/var/www
    # depends_on:
    #   mysql:
    #     condition: service_healthy
    depends_on:
      - redis
    networks:
      - wms-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g

  redis:
    image: redis:alpine
    container_name: wms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - wms-network

