# =============================================================
# WMS Modular Monolith — Docker Compose
# =============================================================
# Variabel Kontrol Tesis:
#   - App service dibatasi 2 vCPU dan 2GB RAM
#   - Sesuai kondisi pengujian beban Bab III
# =============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-app
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "false"      # ← matikan debug agar tidak generate stack traces tiap request
      APP_KEY: base64:RpEzPp1B9yud2sE1FKSWJ0KL3B+8G8/pdRfZ6iWBrvs=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: wms_db_eda
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: K4Si9vNYmdFYtwfMrF7IR1yq9JxsrgcJXlresry5b2JdwJ4waHFZuDpwfdeUatOp
      JWT_ALGO: HS256
      SESSION_DRIVER: redis      # ← PERBAIKAN UTAMA: dari 'database' ke 'redis'
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    volumes:
      - .:/var/www
      - vendor_eda:/var/www/vendor   # ← vendor di Docker volume, bukan Windows filesystem
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - wms-network
    # ─── Resource Limits (Variabel Kontrol Tesis) ─────────────
    # Syntax yang benar untuk docker compose (bukan Swarm):
    #   cpus dan mem_limit di level service langsung
    deploy:
      resources:
        limits:
          cpus: '2.0'      # 2 vCPU
          memory: 2G       # 2 GB RAM
    # Untuk docker compose v2 style (lebih kompatibel):
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-worker
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:RpEzPp1B9yud2sE1FKSWJ0KL3B+8G8/pdRfZ6iWBrvs=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: wms_db_eda
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      JWT_SECRET: K4Si9vNYmdFYtwfMrF7IR1yq9JxsrgcJXlresry5b2JdwJ4waHFZuDpwfdeUatOp
      JWT_ALGO: HS256
    volumes:
      - .:/var/www
      - vendor_eda:/var/www/vendor   # ← shared volume vendor dengan app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - wms-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g

  redis:
    image: redis:alpine
    container_name: wms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - wms-network

  mysql:
    image: mysql:8.0
    container_name: wms-mysql-eda
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wms_db_eda
      MYSQL_USER: wms_user
      MYSQL_PASSWORD: wms_password
    volumes:
      - wms_mysql_eda_data:/var/lib/mysql
    command: --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wms-network

  prometheus:
    image: prom/prometheus:latest
    container_name: wms-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    ports:
      - "9090:9090"
    networks:
      - wms-network

  grafana:
    image: grafana/grafana:latest
    container_name: wms-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana                                          # ← data persistent (dashboard, user, dll)
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro             # ← provisioning datasource & dashboard
    depends_on:
      - prometheus
    networks:
      - wms-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: wms-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - wms-network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: wms-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    networks:
      - wms-network

volumes:
  vendor_eda:              # Named volume untuk folder vendor (mencegah I/O lambat dari Windows)
    driver: local
  wms_mysql_eda_data:
    driver: local
  grafana_data:            # Named volume untuk data Grafana (dashboard, user, plugin tidak hilang saat restart)
    driver: local

networks:
  wms-network:
    driver: bridge
